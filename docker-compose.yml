services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthcheck
      POSTGRES_PASSWORD: healthcheck
      POSTGRES_DB: healthcheck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcheck -d healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      APP_ENV: development
      APP_VERSION: 1.0.0
      DATABASE_URL: postgresql+psycopg://healthcheck:healthcheck@postgres:5432/healthcheck
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:3000
      MOCK_CONNECTORS: "false"
      SEED_ON_STARTUP: "false"
      SSH_PORT: "2222"
      CREDENTIAL_KEY: _iwmMUD3UBicRWWSkwGosyXUBwNvy62qJgKNVJbKvKQ=
      JWT_SECRET: lab-only-jwt-secret-change-me
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      CELERY_EAGER: "false"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  worker:
    build: ./backend
    user: "10001:10001"
    entrypoint: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://healthcheck:healthcheck@postgres:5432/healthcheck
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      LOG_LEVEL: INFO
      MOCK_CONNECTORS: "false"
      SEED_ON_STARTUP: "false"
      SSH_PORT: "2222"
      CREDENTIAL_KEY: _iwmMUD3UBicRWWSkwGosyXUBwNvy62qJgKNVJbKvKQ=
      JWT_SECRET: lab-only-jwt-secret-change-me
      CELERY_EAGER: "false"
    volumes:
      - ./data:/data
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_ORIGIN: http://localhost:8001
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
