[project]
name = "migration-healthcheck"
version = "0.1.0"
requires-python = ">=3.14"
description = "Migration HealthCheck and Comparison Platform API"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["app"]
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = [
  "paramiko.*",
  "winrm.*",
  "celery.*",
  "pandas.*",
  "reportlab.*",
  "openpyxl.*",
  "alembic.*",
]
ignore_missing_imports = true
